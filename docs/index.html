.btn { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin: 5px; }
.btn-danger { background: #e74c3c; }
.btn-success { background: #27ae60; }
.stock-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
.stock-info { flex: 1; }
.update-time { text-align: center; color: #888; font-size: 12px; padding: 10px; }
input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin: 5px; }
