latestStocks.forEach(s => { const cls = s.change_pct >= 0 ? "up" : "down"; const name = s.stock_name || ""; tbody.innerHTML += "<tr><td><span class=\"stock-name\">" + name + "</span><br><span class=\"stock-code\">" + s.stock_code + "</span></td><td>" + s.date + "</td><td>" + s.close_price + "</td><td class=\"" + cls + "\">" + s.change_pct + "%</td></tr>"; });
const newsList = document.getElementById("newsList");
newsData.slice(0, 20).forEach(n => { newsList.innerHTML += "<div class=\"news-item\"><div class=\"news-title\">" + (n.title || "无标题") + "</div><div class=\"news-meta\">" + (n.source || "") + " | " + (n.publish_time || "") + "</div></div>"; });
const finTbody = document.querySelector("#financialTable tbody");
financialData.slice(0, 10).forEach(f => { const name = f.stock_name || ""; finTbody.innerHTML += "<tr><td><span class=\"stock-name\">" + name + "</span><br><span class=\"stock-code\">" + f.stock_code + "</span></td><td>" + (f.report_date || "") + "</td><td>" + (f.total_revenue ? (f.total_revenue/100000000).toFixed(2) + "亿" : "-") + "</td><td>" + (f.net_profit ? (f.net_profit/100000000).toFixed(2) + "亿" : "-") + "</td><td>" + (f.roe ? f.roe.toFixed(2) + "%" : "-") + "</td></tr>"; });
function renderStockManager() { const mgr = document.getElementById("stockManager"); let html = "<div style=\"margin-bottom:15px;\">"; stocks.forEach((s, i) => { html += "<div class=\"stock-item\"><div class=\"stock-info\"><span class=\"stock-name\">" + s.name + "</span> <span class=\"stock-code\">" + s.code + "</span></div><button class=\"btn btn-danger\" onclick=\"removeStock(" + i + ")\">删除</button></div>"; }); html += "</div>"; html += "<div><input id=\"newCode\" placeholder=\"股票代码\" style=\"width:100px;\"><input id=\"newName\" placeholder=\"股票名称\" style=\"width:100px;\"><button class=\"btn btn-success\" onclick=\"addStock()\">添加</button></div>"; html += "<div style=\"margin-top:15px;\"><a href=\"" + REPO_URL + "\" target=\"_blank\" class=\"btn\">在 GitHub 编辑配置文件</a></div>"; mgr.innerHTML = html; }
function addStock() { const code = document.getElementById("newCode").value.trim(); const name = document.getElementById("newName").value.trim(); if (code && name) { alert("请在 GitHub 编辑 config.yaml 添加：\\n- code: \"" + code + "\"\\n  name: \"" + name + "\"\\n\\n然后点击链接打开编辑器"); window.open(REPO_URL, "_blank"); } else { alert("请输入股票代码和名称"); } }
function removeStock(i) { if (confirm("确定删除 " + stocks[i].name + "？\\n\\n请在 GitHub 编辑 config.yaml 删除该股票")) { window.open(REPO_URL, "_blank"); } }
renderStockManager();
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
