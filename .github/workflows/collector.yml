name: A股数据采集

on:
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: 安装依赖
      run: pip install -r requirements.txt
    - name: 采集数据
      run: python collector.py
    - name: 保存数据到仓库
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add data/stock_data.db
        git add logs/collector.log
        git commit -m "自动更新数据 $(date +'%Y-%m-%d %H:%M')" || echo "没有新数据"
        git push
    - name: 上传日志
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: collector-logs
        path: logs/collector.log
        retention-days: 7